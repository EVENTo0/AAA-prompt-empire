name: Mobile Control Plane

on:
  pull_request:
    paths:
      - 'apps/mobile-control-plane/**'
      - '.github/workflows/mobile-control-plane.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-control-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile-control-plane
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install pinned direct dependencies
        run: npm install --ignore-scripts
      - name: Security contracts
        run: npm run test:contracts
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
