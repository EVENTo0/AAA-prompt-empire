name: Empire Guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: empire-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: governance-and-skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate Empire v2 governance
        run: python scripts/validate_empire.py
      - name: Run routing and permission contract evals
        run: python scripts/run_empire_evals.py
      - name: Validate AI reading learning protocol and synthetic scorer tests
        run: |
          python scripts/run_ai_book_agent_learning_eval.py
          python -m unittest discover -s tests -p 'test_ai_book_agent_learning_eval.py' -v
          python -m unittest discover -s tests -p 'test_prepare_ai_book_agent_runs.py' -v
      - name: Validate EVENTO Memory and Agent Contract Gate 1
        run: python scripts/validate_evento_control_plane.py
      - name: Check workflow text hygiene
        run: |
          python - <<'PY'
          import pathlib
          for p in pathlib.Path('.github/workflows').glob('*.yml'):
              text=p.read_text(encoding='utf-8')
              if chr(9) in text:
                  raise SystemExit(f'tab character not allowed in {p}')
          print('workflow text checks passed')
          PY

  evento-memory-db-security:
    name: evento-memory-db-security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      - name: Prove EVENTO Memory migration security on clean local database
        shell: bash
        run: |
          set -euo pipefail
          work_dir="${RUNNER_TEMP}/evento-memory-db"
          cleanup() {
            if [ -d "${work_dir}/supabase" ]; then
              (cd "${work_dir}" && supabase stop --no-backup) || true
            fi
            rm -rf "${work_dir}"
          }
          trap cleanup EXIT

          rm -rf "${work_dir}"
          mkdir -p "${work_dir}"
          cd "${work_dir}"
          supabase init
          # Use a dedicated non-default DB port so this isolated proof cannot
          # collide with another Supabase stack on the runner.
          sed -i 's/^port = 54322$/port = 55432/' supabase/config.toml
          mkdir -p supabase/migrations
          cp "${GITHUB_WORKSPACE}/supabase/migrations/20261001190000_evento_memory_v1.sql" supabase/migrations/

          supabase db start

          PGPASSWORD=postgres psql \
            "postgresql://postgres@127.0.0.1:55432/postgres" \
            -X \
            -v ON_ERROR_STOP=1 \
            -f "${GITHUB_WORKSPACE}/supabase/tests/evento_memory_v1_security.sql"

  sensitive-diff:
    name: sensitive-diff-policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify sensitive governance changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | tee /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          sensitive_prefixes = (
              'AGENTS.md', 'CLAUDE.md', '.agents/', '.claude/', '.codex/',
              '.github/', 'docs/security/', 'docs/adr/', 'scripts/', 'registry/', 'evals/'
          )
          changed = [x.strip() for x in Path('/tmp/changed.txt').read_text().splitlines() if x.strip()]
          hits = [x for x in changed if x == 'AGENTS.md' or x == 'CLAUDE.md' or x.startswith(sensitive_prefixes[2:])]
          if hits:
              print('Sensitive Empire control-plane files changed:')
              print('\\n'.join(f'- {x}' for x in hits))
              print('CODEOWNERS + branch/ruleset protection should require owner review before merge.')
          else:
              print('No sensitive control-plane paths changed.')
          PY
