plugins {
    id 'com.android.application'
}

android {
    namespace 'ae.evento.admin'
    compileSdk 36

    defaultConfig {
        applicationId 'ae.evento.admin'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
}
