[package]
name = "evento-desktop"
version = "0.1.0"
description = "EVENTO native operator shell"
authors = ["EVENTO"]
edition = "2024"
rust-version = "1.99"

[lib]
name = "evento_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = ["tray-icon"] }
tauri-plugin-autostart = "2.6.0"
keyring = { version = "4.2.0", features = ["v1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
ureq = { version = "3", features = ["json"] }
